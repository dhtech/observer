name: Release

# A tag vX.Y.Z - pushed, or made together with a release on the releases
# page - builds the release (.github/build.sh), installs and tries the
# Debian package in a new debian:13 container that has only the package
# (.github/try.sh), and puts on the GitHub release of that tag, for
# amd64 and arm64:
#
#   observer_<version>_<arch>.deb    the Debian package, with a systemd unit
#   observer-<arch>-v<version>.gz    the binary alone, as before
#   SHA256SUMS
#
# The files of a release are put there once: changing the release's
# text afterwards builds nothing again.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # the latest stable Go release, whatever it is on the day
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - run: go version

      - name: Build the binaries and the packages
        run: sh .github/build.sh "${GITHUB_REF_NAME#v}"

      - name: Install and try the package on a machine with nothing else
        run: >
          docker run --rm --cap-add NET_ADMIN --cap-add NET_RAW
          -v "$PWD:/src:ro" -w /src debian:13
          sh .github/try.sh "${GITHUB_REF_NAME#v}"

      # the release is made here unless the releases page made it already
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1 ||
            gh release create "${GITHUB_REF_NAME}" \
              --title "observer-${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/*
